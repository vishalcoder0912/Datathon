name: kavach

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kavach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach_local_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kavach_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - kavach

volumes:
  kavach_postgres_data:
    name: kavach_postgres_data

networks:
  kavach:
    name: kavach
