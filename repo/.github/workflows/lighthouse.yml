name: Lighthouse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Build frontend
        run: npm run build:frontend

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          retention-days: 30

      - name: Check Assertions
        if: always()
        run: |
          echo "Lighthouse CI assertions complete. Check the uploaded reports for details."
          if [ -f "reports/lighthouse/assertion-results.json" ]; then
            cat reports/lighthouse/assertion-results.json
          fi
