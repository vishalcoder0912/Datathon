name: insightflow

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: insightflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach_local_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - insightflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kavach} -d ${POSTGRES_DB:-kavach}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - insightflow

  qdrant:
    image: qdrant/qdrant:latest
    container_name: insightflow-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - insightflow_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightflow

  ml-service:
    build:
      context: ./apps/ml-service
      dockerfile: Dockerfile
    container_name: insightflow-ml-service
    restart: unless-stopped
    ports:
      - "${ML_PORT:-5000}:5000"
    environment:
      PORT: 5000
      PYTHONUNBUFFERED: 1
      KAVACH_INCLUDE_LEGACY_ML_ROUTES: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insightflow

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: insightflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach_local_password}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_URL: http://qdrant:6333
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => {process.exit(r.statusCode !== 200)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - insightflow

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insightflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_URL: /api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insightflow

volumes:
  insightflow_postgres_data:
    name: insightflow_postgres_data
  insightflow_qdrant_data:
    name: insightflow_qdrant_data

networks:
  insightflow:
    name: insightflow
