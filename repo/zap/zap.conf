# OWASP ZAP Configuration - InsightFlow
# Active Scan Policy, Context, and Session settings

# ==========================================================
# Context Definition
# ==========================================================
contextName = InsightFlow
contextIncludePaths = [
    "http://localhost:3001.*",
    "https://staging-insightflow.*",
    "https://insightflow.*"
]
contextExcludePaths = [
    "http://localhost:3001/api/health.*",
    "http://localhost:3001/api/ai/test.*"
]
contextTech = [
    "Node.js",
    "React",
    "PostgreSQL",
    "Python",
    "Docker"
]

# ==========================================================
# Authentication
# ==========================================================
authMethod = "json-based-script"
authScript = "${zapHome}/scripts/auth/insightflow-auth.js"
authEndpoint = "http://localhost:3001/api/auth/login"
authLoginPage = "http://localhost:3001"
authPayloadConfig = "token"
authCredentialsParams =
    usernameField = "email"
    passwordField = "password"
    usernameValue = "security-scan@kavach.local"
    passwordValue = "${ZAP_SCAN_PASSWORD}"

# ==========================================================
# Active Scan Policy
# ==========================================================
policyName = "InsightFlow-Active-Scan"
attackStrength = "MEDIUM"
alertThreshold = "MEDIUM"

# Category settings (0=off, 1=info, 2=low, 3=medium, 4=high)
cat100 = 3   # Information Disclosure
cat200 = 3   # Injection
cat300 = 4   # Session Management
cat400 = 3   # Cross-Site Scripting (XSS)
cat500 = 3   # Remote File Inclusion
cat600 = 3   # Server-Side Request Forgery
cat700 = 3   # Path Traversal
cat800 = 4   # CRLF Injection / HTTP Splitting
cat900 = 3   # Remote Code Execution
cat1000 = 2  # Beacon / Command and Control

# ==========================================================
# Passive Scan Configuration
# ==========================================================
passiveScanEnabled = true
passiveScanMaxAlertsPerRule = 50

# ==========================================================
# Session Management
# ==========================================================
sessionManagementMethod = "cookieBasedSession"
sessionTokenName = "kavach_refresh"

# ==========================================================
# AJAX Spider
# ==========================================================
ajaxSpiderEnabled = true
ajaxSpiderMaxCrawlDepth = 5
ajaxSpiderMaxCrawlStates = 20

# ==========================================================
# Reporting
# ==========================================================
reportTitle = "InsightFlow Security Scan Report"
reportTemplate = "traditional-json"
reportDirectory = "${zapHome}/reports/"
