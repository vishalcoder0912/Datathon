sonar.projectKey=insightflow
sonar.organization=insightflow
sonar.host.url=https://sonarcloud.io

# Modules
sonar.modules=backend,frontend,ml-service

# Source encoding
sonar.sourceEncoding=UTF-8

# Languages
sonar.language=ts,js,py

# ---- Backend ----
backend.sonar.projectBaseDir=apps/backend
backend.sonar.sources=src
backend.sonar.tests=src/__tests__
backend.sonar.test.inclusions=**/*.test.js,**/*.spec.js
backend.sonar.javascript.lcov.reportPaths=../../coverage/backend/lcov.info

# ---- Frontend ----
frontend.sonar.projectBaseDir=apps/frontend
frontend.sonar.sources=src
frontend.sonar.tests=src/__tests__
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
frontend.sonar.typescript.lcov.reportPaths=../../coverage/frontend/lcov.info

# ---- ML Service ----
ml-service.sonar.projectBaseDir=apps/ml-service
ml-service.sonar.sources=.
ml-service.sonar.tests=tests
ml-service.sonar.python.coverage.reportPaths=../../coverage/ml-service/coverage.xml
ml-service.sonar.python.xunit.reportPath=../../coverage/ml-service/xunit.xml

# Global exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/vendor/**,\
  **/__pycache__/**,\
  **/*.egg-info/**,\
  **/.git/**,\
  **/graphify-out/**,\
  **/exports/**,\
  **/retry-the-project/**,\
  **/repo/**, \
  **/data/**, \
  **/scratch/**

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**, \
  **/vendor/**

# Global test coverage exclusions
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/mocks/**,\
  **/fixtures/**, \
  **/tests/**, \
  **/scripts/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/node_modules/**,\
  **/dist/**, \
  **/tests/fixtures/**

# File size limits
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.js
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*test*.py
